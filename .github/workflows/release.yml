name: Release Android App & Publish Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes for this build'
        required: false
        default: 'General bug fixes, stability improvements, and UI refinements.'

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Strict Secrets Verification Gate
      - name: Verify Required Signing Secrets
        run: |
          echo "Checking required production signing secrets..."
          MISSING_SECRETS=()
          [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && MISSING_SECRETS+=("RELEASE_KEYSTORE_BASE64")
          [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && MISSING_SECRETS+=("RELEASE_STORE_PASSWORD")
          [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] && MISSING_SECRETS+=("RELEASE_KEY_ALIAS")
          [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] && MISSING_SECRETS+=("RELEASE_KEY_PASSWORD")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING_SECRETS[*]}"
            echo "Please configure them under: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "All required signing secrets are present."

      # Step 2: Set up Java Development Kit
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Decode Permanent Production Keystore
      - name: Decode Production Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release-keystore.jks" ]; then
            echo "::error::Decoded release-keystore.jks is empty or corrupted!"
            exit 1
          fi
          echo "Keystore successfully decoded."

      # Step 4: Ensure Gradle Executable
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # Step 5: Run Automated Unit & Robolectric Tests
      - name: Run Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Step 6: Build Signed Production APK
      - name: Build Signed Production APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Step 7: Strict Release Verification & Manifest Generation
      - name: Verify Signed APK & Generate Update Manifest
        id: verify_apk
        env:
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          chmod +x scripts/verify-and-generate-manifest.sh
          ./scripts/verify-and-generate-manifest.sh "$REPO_NAME" "$TAG_NAME" "$CUSTOM_NOTES"

      # Step 8: Create GitHub Release with APK & Manifest
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            version.json
          name: "Release ${{ steps.verify_apk.outputs.version_name }} (Build ${{ steps.verify_apk.outputs.version_code }})"
          body_path: release-notes.md
          draft: false
          prerelease: false

      # Step 9: Update version.json on main branch for raw GitHub updates
      - name: Commit version.json to Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout master || true
          cp version.json ./version.json
          git add version.json
          git commit -m "chore(release): update version.json for ${{ steps.verify_apk.outputs.version_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD || echo "Push skipped or branch protected"

      # Step 10: Secure Keystore Cleanup
      - name: Cleanup Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release-keystore.jks"
